version: "3"
services:
    www:
      depends_on:
      - mysql
      build: . # We can use the build in case we need to build the libraries before load like mysqli etc
      # image: php:8.3.21-apache // we are changing this because we need to run MYSQLI for the connection docker compose down
      ports:
      - 88:80
      # - 443:443
      volumes:
      - ./:/var/www/html
  # MSQL SERVER
    mysql:
      image: mysql:latest
      environment:
        - MYSQL_DATABASE=login_session_assignment
        - MYSQL_USER=login
        - MYSQL_PASSWORD=password
        - MYSQL_ALLOW_EMPTY_PASSWORD=1

  # PHPMYADMIN
    phpmyadmin:
      depends_on:
        - mysql
      image: phpmyadmin:latest
      ports:
      - 82:80
      environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
